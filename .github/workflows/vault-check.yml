name: Vault check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vault-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Test snapshot generation
        run: bash tools/test-vault-state.sh

      # tools/check-vault.sh: front-matter, Legal & Ethics cross-references,
      # stale [verify] markers, wikilink targets, count parity. Exits 1 on any.
      - name: Lint the vault
        run: |
          set -euo pipefail
          chmod +x tools/check-vault.sh
          ./tools/check-vault.sh

      # Reproduce the published snapshot at its recorded date. Using today's
      # date would fail an unchanged checkout as the generation date and ages
      # advance. The lint step still checks source freshness against today.
      - name: Generated counts are up to date
        run: |
          set -euo pipefail
          chmod +x tools/build-vault-state.sh
          as_of=$(sed -n 's/^generated: //p' Verification-Status.md)
          : "${as_of:?Verification-Status.md is missing its generated date}"
          VAULT_AS_OF="$as_of" ./tools/build-vault-state.sh
          if ! git diff --quiet; then
            echo "::error::Generated files are stale. Run ./tools/build-vault-state.sh and commit the result."
            git --no-pager diff --stat
            git --no-pager diff
            exit 1
          fi
          echo "Generated counts match the filesystem."
